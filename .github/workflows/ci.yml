name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, docs and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STATE_BACKEND: file
      AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate documentation
        run: node scripts/check-docs.js
      - name: Run full Node suite
        run: npm run test:ci
      - name: Install Chrome for browser checks
        run: npx playwright install --with-deps chrome
      - name: Check two-client lobby
        env:
          QA_OUT: .qa/ci/lobby
        run: node tests/browser-room-setup.cjs
      - name: Check immediate draw feedback and recovery
        env:
          QA_OUT: .qa/ci/draw-feedback
        run: node tests/browser-draw-feedback.cjs
      - name: Check public card motions and market history
        env:
          QA_OUT: .qa/ci/card-ui
        run: node tests/browser-card-ui.cjs
      - name: Check automatic account seat recovery
        env:
          QA_OUT: .qa/ci/account-resume
        run: node tests/browser-account-resume.cjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .qa/ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
