<!doctype html><html lang="es"><meta charset="utf-8"><title>Midsommar Express · Modelos del juego</title>
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9efea;color:#24434a;font:14px system-ui}h1{margin:0 0 6px;font-size:28px}p{margin:0 0 20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#fffdf5;border:1px solid #cbd7cc;border-radius:12px;overflow:hidden}.stage{height:320px}h2{font-size:16px;margin:0;padding:0 20px 18px}canvas{display:block;width:100%;height:100%}</style>
<h1>Midsommar Express</h1><p>Seis composiciones · 22 viajeros por vagón · Modelos reales del juego</p><main></main>
<script type="module">
import {createWagonPreview} from '/wagon-preview.js';
import {wagonAppearance} from '/wagon-models.mjs';
import {HIPPIE_VARIANTS} from '/hippie-model.mjs';
window.previews=[];
for(const variant of HIPPIE_VARIANTS){
  const article=document.createElement('article');article.innerHTML='<div class="stage"></div><h2></h2>';
  article.querySelector('h2').textContent=variant.label;document.querySelector('main').append(article);
  let key=0;while(wagonAppearance('hippie',String(key)).variant!==variant.id)key++;
  const preview=createWagonPreview({container:article.querySelector('.stage'),onFailure:()=>{throw Error('Preview WebGL failure');}});
  preview.update('#ffffff',String(key));window.previews.push(preview);
}
window.ready=true;
</script></html>
