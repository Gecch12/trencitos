services:
  - type: web
    name: trencitos-swamp
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - '**/*.md'
        - experiments/**
        - scripts/preview-passenger-extreme.cjs
        - tests/*passenger-extreme*
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: STATE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NODE_ENV
        value: production
